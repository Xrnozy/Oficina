<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply stored theme before first paint; default to the OS preference.
      try {
        var t = localStorage.getItem('oc-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="officeChain — local-first AI agent office. A deterministic engine runs the build loop; agents do the work." />
